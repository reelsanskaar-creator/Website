
<!DOCTYPE html>
<html lang="gu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jgvfriendship all in one tools</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap');

        :root {
            --bg-gradient: linear-gradient(135deg, #6366f1 0%, #a855f7 50%, #ec4899 100%);
            --card-bg: rgba(255, 255, 255, 0.9);
            --text-color: #1f2937;
            --primary-color: #6366f1;
            --primary-hover: #4f46e5;
        }

        body {
            font-family: 'Poppins', sans-serif;
            background: var(--bg-gradient);
            background-attachment: fixed;
            color: var(--text-color);
            margin: 0;
            padding: 30px 15px;
            text-align: center;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        header h1 {
            color: #ffffff;
            margin-bottom: 5px;
            font-size: 2.2rem;
            text-shadow: 0 4px 10px rgba(0, 0, 0, 0.2);
            animation: fadeInDown 0.8s ease-in-out;
        }

        header p {
            color: #f3f4f6;
            margin-top: 0;
            font-size: 1.05rem;
            text-shadow: 0 2px 5px rgba(0, 0, 0, 0.2);
            animation: fadeInUp 0.8s ease-in-out;
        }

        /* Glassmorphism Navigation Container */
        .nav-section {
            background: var(--card-bg);
            backdrop-filter: blur(12px);
            width: 100%;
            max-width: 600px;
            margin: 25px auto;
            padding: 25px;
            border-radius: 20px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.2);
            border: 1px solid rgba(255, 255, 255, 0.5);
            animation: zoomIn 0.6s ease-in-out;
            box-sizing: border-box;
        }

        .search-container {
            margin-bottom: 20px;
        }

        #search-input {
            width: 100%;
            padding: 14px 20px;
            font-size: 16px;
            border: 2px solid #e5e7eb;
            border-radius: 12px;
            outline: none;
            box-sizing: border-box;
            transition: all 0.3s ease;
            background: #ffffff;
        }

        #search-input:focus {
            border-color: var(--primary-color);
            box-shadow: 0 0 15px rgba(99, 102, 241, 0.3);
            transform: scale(1.01);
        }

        #button-container {
            display: flex;
            justify-content: center;
            gap: 12px;
            flex-wrap: wrap;
        }

        /* Animated Colorful Buttons */
        .nav-btn {
            background: linear-gradient(135deg, #4f46e5 0%, #7c3aed 100%);
            color: white;
            border: none;
            padding: 12px 22px;
            font-size: 15px;
            font-weight: 600;
            border-radius: 12px;
            cursor: pointer;
            text-decoration: none;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 0 4px 15px rgba(79, 70, 229, 0.3);
            position: relative;
            overflow: hidden;
        }

        .nav-btn::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.3), transparent);
            transition: 0.5s;
        }

        .nav-btn:hover::before {
            left: 100%;
        }

        .nav-btn:hover {
            transform: translateY(-4px) scale(1.05);
            box-shadow: 0 8px 25px rgba(79, 70, 229, 0.5);
        }

        .no-result {
            color: #ef4444;
            font-style: italic;
            font-size: 0.95rem;
            margin-top: 15px;
            display: none;
        }

        /* Arrow Navigation Animation */
        .arrow-container {
            margin-top: 25px;
            display: flex;
            justify-content: center;
            gap: 15px;
            animation: fadeIn 1s ease-in-out;
        }

        .arrow-btn {
            background: linear-gradient(135deg, #06b6d4 0%, #3b82f6 100%);
            color: white;
            padding: 12px 24px;
            font-size: 15px;
            font-weight: 600;
            border-radius: 12px;
            text-decoration: none;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(6, 182, 212, 0.3);
        }

        .arrow-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 6px 20px rgba(6, 182, 212, 0.5);
        }

        .disabled {
            background: #cbd5e1 !important;
            color: #94a3b8 !important;
            pointer-events: none;
            box-shadow: none !important;
            transform: none !important;
        }

        /* Animations Keyframes */
        @keyframes fadeInDown {
            from { opacity: 0; transform: translateY(-20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes zoomIn {
            from { opacity: 0; transform: scale(0.9); }
            to { opacity: 1; transform: scale(1); }
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }
    </style>
</head>
<body>

    <header>
        <h1>Jgvfriendship all in one tools</h1>
        <p>✨ 📖 FREE LIFE TOOLS & GAMES 📚 ✨</p>
    </header>

    <div class="nav-section">
        <div class="search-container">
            <input type="text" id="search-input" placeholder="🔍 ફાઇલ શોધો (Search)..." onkeyup="filterPages()">
            <div id="no-result-msg" class="no-result">કોઈ પેજ મળ્યું નથી!</div>
        </div>
        <div id="button-container"></div>
    </div>

    <div class="arrow-container" id="arrow-container"></div>

    <script>
        // રીપોઝીટરીની ફાઇલોની યાદી (તમે અહીં kids-game.html પણ ઉમેરી શકો છો)
        const pages = [
            { name: "Home ", file: "index.html" },
            { name: "All-in-One Tools", file: "all-in-one-tools.html" },
            { name: "Kids Game 🎮", file: "kids-game.html" },
            { name: "Other Page", file: "other.html" }
        ];

        const currentPage = window.location.pathname.split("/").pop() || "index.html";

        function renderButtons(pagesToDisplay) {
            const container = document.getElementById("button-container");
            container.innerHTML = "";

            if (pagesToDisplay.length === 0) {
                document.getElementById("no-result-msg").style.display = "block";
                return;
            } else {
                document.getElementById("no-result-msg").style.display = "none";
            }

            pagesToDisplay.forEach(page => {
                const btn = document.createElement("a");
                btn.href = page.file;
                btn.innerText = page.name;
                btn.className = "nav-btn";
                
                if (page.file === currentPage) {
                    btn.style.background = "linear-gradient(135deg, #f59e0b 0%, #d97706 100%)"; // Active page highlight color
                    btn.style.color = "#ffffff";
                    btn.style.boxShadow = "0 4px 15px rgba(245, 158, 11, 0.4)";
                    btn.title = "તમે હાલ આ પેજ પર છો";
                }

                container.appendChild(btn);
            });
        }

        renderButtons(pages);

        function filterPages() {
            const query = document.getElementById("search-input").value.toLowerCase();
            const filtered = pages.filter(p => p.name.toLowerCase().includes(query) || p.file.toLowerCase().includes(query));
            renderButtons(filtered);
        }

        // Previous & Next Navigation Setup
        const currentIndex = pages.findIndex(p => p.file === currentPage);
        const arrowContainer = document.getElementById("arrow-container");

        const prevBtn = document.createElement("a");
        prevBtn.innerText = "⬅ પાછળ";
        prevBtn.className = "arrow-btn";
        if (currentIndex > 0) {
            prevBtn.href = pages[currentIndex - 1].file;
        } else {
            prevBtn.classList.add("disabled");
        }
        arrowContainer.appendChild(prevBtn);

        const nextBtn = document.createElement("a");
        nextBtn.innerText = "આગળ ➡";
        nextBtn.className = "arrow-btn";
        if (currentIndex !== -1 && currentIndex < pages.length - 1) {
            nextBtn.href = pages[currentIndex + 1].file;
        } else {
            nextBtn.classList.add("disabled");
        }
        arrowContainer.appendChild(nextBtn);
    </script>
</body>
</html>
